definitions:
  fusionauth.AuthenticatorConfiguration:
    properties:
      algorithm:
        $ref: '#/definitions/fusionauth.TOTPAlgorithm'
      codeLength:
        type: integer
      timeStep:
        type: integer
    type: object
  fusionauth.BreachedPasswordStatus:
    enum:
    - None
    - ExactMatch
    - SubAddressMatch
    - PasswordOnly
    - CommonPassword
    type: string
    x-enum-varnames:
    - BreachedPasswordStatus_None
    - BreachedPasswordStatus_ExactMatch
    - BreachedPasswordStatus_SubAddressMatch
    - BreachedPasswordStatus_PasswordOnly
    - BreachedPasswordStatus_CommonPassword
  fusionauth.ChangePasswordReason:
    enum:
    - Administrative
    - Breached
    - Expired
    - Validation
    type: string
    x-enum-varnames:
    - ChangePasswordReason_Administrative
    - ChangePasswordReason_Breached
    - ChangePasswordReason_Expired
    - ChangePasswordReason_Validation
  fusionauth.ContentStatus:
    enum:
    - ACTIVE
    - PENDING
    - REJECTED
    type: string
    x-enum-varnames:
    - ContentStatus_ACTIVE
    - ContentStatus_PENDING
    - ContentStatus_REJECTED
  fusionauth.GroupMember:
    properties:
      data:
        additionalProperties: true
        type: object
      groupId:
        type: string
      id:
        type: string
      insertInstant:
        type: integer
      user:
        $ref: '#/definitions/fusionauth.User'
      userId:
        type: string
    type: object
  fusionauth.TOTPAlgorithm:
    enum:
    - HmacSHA1
    - HmacSHA256
    - HmacSHA512
    type: string
    x-enum-varnames:
    - TOTPAlgorithm_HmacSHA1
    - TOTPAlgorithm_HmacSHA256
    - TOTPAlgorithm_HmacSHA512
  fusionauth.TwoFactorMethod:
    properties:
      authenticator:
        $ref: '#/definitions/fusionauth.AuthenticatorConfiguration'
      email:
        type: string
      id:
        type: string
      lastUsed:
        type: boolean
      method:
        type: string
      mobilePhone:
        type: string
      secret:
        type: string
    type: object
  fusionauth.User:
    properties:
      active:
        type: boolean
      birthDate:
        type: string
      breachedPasswordLastCheckedInstant:
        type: integer
      breachedPasswordStatus:
        $ref: '#/definitions/fusionauth.BreachedPasswordStatus'
      cleanSpeakId:
        type: string
      connectorId:
        type: string
      data:
        additionalProperties: true
        type: object
      email:
        type: string
      encryptionScheme:
        type: string
      expiry:
        type: integer
      factor:
        type: integer
      firstName:
        type: string
      fullName:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      insertInstant:
        type: integer
      lastLoginInstant:
        type: integer
      lastName:
        type: string
      lastUpdateInstant:
        type: integer
      memberships:
        items:
          $ref: '#/definitions/fusionauth.GroupMember'
        type: array
      middleName:
        type: string
      mobilePhone:
        type: string
      parentEmail:
        type: string
      password:
        type: string
      passwordChangeReason:
        $ref: '#/definitions/fusionauth.ChangePasswordReason'
      passwordChangeRequired:
        type: boolean
      passwordLastUpdateInstant:
        type: integer
      preferredLanguages:
        items:
          type: string
        type: array
      registrations:
        items:
          $ref: '#/definitions/fusionauth.UserRegistration'
        type: array
      salt:
        type: string
      tenantId:
        type: string
      timezone:
        type: string
      twoFactor:
        $ref: '#/definitions/fusionauth.UserTwoFactorConfiguration'
      uniqueUsername:
        type: string
      username:
        type: string
      usernameStatus:
        $ref: '#/definitions/fusionauth.ContentStatus'
      verified:
        type: boolean
      verifiedInstant:
        type: integer
    type: object
  fusionauth.UserRegistration:
    properties:
      applicationId:
        type: string
      authenticationToken:
        type: string
      cleanSpeakId:
        type: string
      data:
        additionalProperties: true
        type: object
      id:
        type: string
      insertInstant:
        type: integer
      lastLoginInstant:
        type: integer
      lastUpdateInstant:
        type: integer
      preferredLanguages:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      timezone:
        type: string
      tokens:
        additionalProperties:
          type: string
        type: object
      username:
        type: string
      usernameStatus:
        $ref: '#/definitions/fusionauth.ContentStatus'
      verified:
        type: boolean
      verifiedInstant:
        type: integer
    type: object
  fusionauth.UserTwoFactorConfiguration:
    properties:
      methods:
        items:
          $ref: '#/definitions/fusionauth.TwoFactorMethod'
        type: array
      recoveryCodes:
        items:
          type: string
        type: array
    type: object
  github_com_kptm-tools_core-service_pkg_api.APIError:
    properties:
      error:
        type: string
    type: object
  github_com_kptm-tools_core-service_pkg_auth.LoginResponse:
    properties:
      otp:
        description: |-
          OTPKey is the secret key used to generate the one‑time password.
          example: JBSWY3DPEHPK3PXP
        type: string
      tenantId:
        description: |-
          TenantID identifies the tenant to which the user belongs.
          example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      token:
        description: |-
          Token is the JWT to be used for subsequent requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      tokenExpirationInstant:
        description: |-
          TokenExpirationInstant is the RFC3339 timestamp when the token expires.
          example: 2025-07-07T20:15:30Z
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/fusionauth.User'
        description: |-
          User contains basic information about the authenticated user.
          Uses our local wrapper so swag can generate a schema for it.
    type: object
  github_com_kptm-tools_core-service_pkg_domain.WebVulnerabilityInstance:
    properties:
      attack:
        type: string
      evidence:
        type: string
      method:
        type: string
      other_info:
        type: string
      param:
        type: string
      uri:
        type: string
    type: object
  github_com_kptm-tools_core-service_pkg_dto.CWERemediation:
    properties:
      cwe_id:
        type: string
      description:
        type: string
      effectiveness:
        type: string
      effectiveness_notes:
        type: string
      last_updated:
        type: string
      mitigation_id:
        type: string
      phase:
        type: string
      title:
        type: string
    type: object
  github_com_kptm-tools_core-service_pkg_dto.LoginRequest:
    properties:
      application_id:
        description: |-
          ApplicationID is the UUID of the application requesting authentication.
          example: 00000000-1111-0000-0000-000000000000
        type: string
      loginId:
        description: |-
          LoginID is the user's identifier, usually their email.
          example: admin@example.com
        type: string
      password:
        description: |-
          Password is the user's plaintext password.
          example: password
        type: string
    required:
    - application_id
    - loginId
    - password
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanAssetsOperatingSystem:
    properties:
      accuracy:
        description: accuracy is the confidence percentage of the detection.
        type: integer
      cpe:
        description: cpe is the Common Platform Enumeration string.
        type: string
      critical_count:
        description: critical_count count of critical vulnerabilities.
        type: integer
      family:
        description: family groups this OS into a family (e.g. "Linux").
        type: string
      full_name:
        description: |-
          Fullname of the operating system with user (e.g. "Ubuntu").
          required: true
        type: string
      high_count:
        description: high_count count of high-severity vulnerabilities.
        type: integer
      host_id:
        description: |-
          host_id is the identifier of the scanned host.
          required: true
        type: string
      id:
        description: |-
          id is the unique identifier for the OS record.
          required: true
        type: integer
      low_count:
        description: low_count count of low-severity vulnerabilities.
        type: integer
      medium_count:
        description: medium_count count of medium-severity vulnerabilities.
        type: integer
      name:
        description: |-
          name of the operating system (e.g. "Ubuntu").
          required: true
        type: string
      none_count:
        description: none_count count of items without severity classification.
        type: integer
      os_type:
        description: os_type indicates the OS type (e.g. "unix", "windows").
        type: string
      scan_id:
        description: |-
          scan_id is the identifier of the scan this record belongs to.
          required: true
        type: string
      total_vulnerabilities_count:
        description: total_vulnerabilities_count total number of detected vulnerabilities.
        type: integer
      unknown_count:
        description: unknown_count count of vulnerabilities with unknown severity.
        type: integer
      version:
        description: version of the operating system (e.g. "20.04").
        type: string
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanAssetsResponse:
    properties:
      operating_system:
        allOf:
        - $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanAssetsOperatingSystem'
        description: |-
          operating_system holds the data of the detected operating system.
          required: true
      services:
        description: |-
          services is the list of services detected on the host.
          required: true
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanAssetsService'
        type: array
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanAssetsService:
    properties:
      cpe:
        description: cpe is the Common Platform Enumeration string.
        type: string
      critical_count:
        description: critical_count count of critical vulnerabilities.
        type: integer
      high_count:
        description: high_count count of high-severity vulnerabilities.
        type: integer
      host_id:
        description: |-
          host_id is the identifier of the scanned host.
          required: true
        type: string
      id:
        description: |-
          id is the unique identifier for the service record.
          required: true
        type: integer
      low_count:
        description: low_count count of low-severity vulnerabilities.
        type: integer
      medium_count:
        description: medium_count count of medium-severity vulnerabilities.
        type: integer
      name:
        description: name of the service (e.g. "ssh").
        type: string
      none_count:
        description: none_count count of items without severity classification.
        type: integer
      port:
        description: port number where the service is running.
        type: integer
      port_state:
        description: port_state indicates the port state (e.g. "open", "closed").
        type: string
      product:
        description: product name (e.g. "OpenSSH").
        type: string
      protocol:
        description: protocol used by the service (e.g. "tcp", "udp").
        type: string
      scan_id:
        description: |-
          scan_id is the identifier of the scan this record belongs to.
          required: true
        type: string
      total_vulnerabilities_count:
        description: total_vulnerabilities_count total number of detected vulnerabilities.
        type: integer
      unknown_count:
        description: unknown_count count of vulnerabilities with unknown severity.
        type: integer
      version:
        description: version of the service or product.
        type: string
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityDetectedOSResponse:
    properties:
      alias:
        type: string
      ip_address:
        type: string
      os_name:
        type: string
      os_type:
        type: string
      references:
        items:
          type: string
        type: array
      remediation:
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.CWERemediation'
        type: array
      scan_date:
        type: string
      scan_id:
        type: string
      severity_counts:
        $ref: '#/definitions/tools.SeverityCounts'
      total_vulnerabilities:
        type: integer
      vulnerabilities:
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityItem'
        type: array
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityDetectedServiceResponse:
    properties:
      references:
        items:
          type: string
        type: array
      remediation:
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.CWERemediation'
        type: array
      scan_date:
        type: string
      scan_id:
        type: string
      service_confidence:
        type: integer
      service_cpe:
        type: string
      service_name:
        type: string
      service_port:
        type: integer
      service_port_state:
        type: string
      service_product:
        type: string
      service_protocol:
        type: string
      service_verion:
        type: string
      severity_counts:
        $ref: '#/definitions/tools.SeverityCounts'
      total_vulnerabilities:
        type: integer
      vulnerabilities:
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityItem'
        type: array
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityItem:
    properties:
      access:
        type: string
      comment:
        type: string
      complexity:
        type: string
      description:
        type: string
      exploitability:
        type: string
      id:
        type: string
      impact_score:
        type: number
      likelihood:
        type: string
      max_cvss:
        type: number
      name:
        type: string
      privileges:
        type: string
      references:
        items:
          type: string
        type: array
      risk_score:
        type: number
      severity:
        type: string
      type:
        type: string
      vendor_comments:
        items:
          $ref: '#/definitions/tools.VendorComment'
        type: array
    type: object
  github_com_kptm-tools_core-service_pkg_dto.ScanWebVulnerabilityResponse:
    properties:
      created_at:
        type: string
      cwe_id:
        type: string
      host_id:
        type: string
      instances:
        items:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_domain.WebVulnerabilityInstance'
        type: array
      reference:
        type: string
      scan_id:
        type: string
      service_id:
        type: string
      solution_advice:
        type: string
      updated_at:
        type: string
      vulnerability_id:
        type: string
      wasc_id:
        type: string
    type: object
  tools.SeverityCounts:
    properties:
      critical:
        type: integer
      high:
        type: integer
      low:
        type: integer
      medium:
        type: integer
      none:
        type: integer
      unknown:
        type: integer
    type: object
  tools.VendorComment:
    properties:
      comment:
        type: string
      last_modified:
        type: string
      organization:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user by login ID, password and application ID.
      parameters:
      - description: Login credentials
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_auth.LoginResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
      summary: Login
      tags:
      - Auth
  /api/scans/{id}/assets:
    get:
      description: Retrieve assets from the OS and Services based on the ScanID of
        KPTM Tools - Core Service
      parameters:
      - description: Scan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanAssetsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "404":
          description: Scan not found
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "409":
          description: Scan status not completed
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
      security:
      - BearerAuth: []
      summary: GetScanAssetsByID
      tags:
      - Scans
  /api/scans/{id}/operating-system/vulnerabilities:
    get:
      description: Retrieve operating system vulnerabilities along with severity counts
        and remediation details for a given scan ID.
      parameters:
      - description: ScanID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityDetectedOSResponse'
        "400":
          description: Invalid UUID format for ScanID
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "404":
          description: Scan not found
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
      security:
      - BearerAuth: []
      summary: GetScanOperatingSystemVulnerabilitiesByID
      tags:
      - Scans
  /api/scans/{id}/services/{service_id}/vulnerabilities:
    get:
      description: Retrieve service vulnerabilities along with severity counts and
        remediation details for a given scan ID.
      parameters:
      - description: ScanID
        in: path
        name: id
        required: true
        type: string
      - description: ServiceID
        in: path
        name: service_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanVulnerabilityDetectedServiceResponse'
        "400":
          description: Invalid UUID format for ScanID
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "404":
          description: Scan not found
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
      security:
      - BearerAuth: []
      summary: GetScanServicesVulnerabilitiesByServiceID
      tags:
      - Scans
  /api/web-vulnerabilities/{id}:
    get:
      description: Retrieve a web vulnerability information with a list of instances
        where it occurred for a given Vulnerability ID.
      parameters:
      - description: Vulnerability ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_dto.ScanWebVulnerabilityResponse'
        "400":
          description: Invalid UUID format for Vulnerability ID
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "404":
          description: Vulnerability not found
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kptm-tools_core-service_pkg_api.APIError'
      security:
      - BearerAuth: []
      summary: GetWebVulnerabilityDetailsByID
      tags:
      - Vulnerabilities
  /healthcheck:
    get:
      description: Check status of the KPTM Tools - Core Service
      produces:
      - application/json
      responses:
        "200":
          description: Healthcheck - OK
          schema:
            type: string
      summary: HealthCheck
      tags:
      - System Status
securityDefinitions:
  BearerAuth:
    description: Type “Bearer” followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
