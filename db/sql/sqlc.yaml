version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/"
    gen:
      go:
        package: "db"
        out: ".."
        sql_package: "database/sql"
        # query_parameter_limit: 2
        emit_json_tags: true
        overrides:
          - db_type: "period_enum"
            go_type: "github.com/kptm-tools/core-service/pkg/domain.PeriodEnum"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: time
              type: "Time"
            # CVSS v3.1 Metrics
          - column: "cve_details.cvss_v31_base_score"
            go_type:
              import: "github.com/cockroachdb/apd/v3"
              type: "NullDecimal"
              package: apd
          - column: "cve_details.cvss_v31_exploitability_score"
            go_type:
              import: "github.com/cockroachdb/apd/v3"
              type: "NullDecimal"
              package: apd
          - column: "cve_details.cvss_v31_impact_score"
            go_type:
              import: "github.com/cockroachdb/apd/v3"
              type: "NullDecimal"
              package: apd
          - column: "cve_details.risk_score"
            go_type:
              import: "github.com/cockroachdb/apd/v3"
              type: "NullDecimal"
              package: apd
